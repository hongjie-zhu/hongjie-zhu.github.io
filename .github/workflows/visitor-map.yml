name: Refresh visitor map
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visitor-map.yml'
      - 'scripts/sync_visitors.py'
permissions:
  contents: write
concurrency:
  group: visitor-map-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh aggregate counts
        run: python3 scripts/sync_visitors.py
      - name: Save current map data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/visitor-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh aggregate visitor map data'
          git push
